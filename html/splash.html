<!doctype html>

<html lang="id">
  <head>
    <meta charset="utf-8" />
    <meta
      content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no"
      name="viewport"
    />
    <title>SOESIE Mobile - RSD dr. Soebandi</title>
    <!-- Google Fonts: Plus Jakarta Sans -->
    <link href="https://fonts.googleapis.com" rel="preconnect" />
    <link crossorigin="" href="https://fonts.gstatic.com" rel="preconnect" />
    <link
      href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&amp;display=swap"
      rel="stylesheet"
    />
    <!-- Material Symbols Outlined -->
    <link
      href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&amp;display=swap"
      rel="stylesheet"
    />
    <link
      href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&amp;display=swap"
      rel="stylesheet"
    />
    <!-- Tailwind CSS v3 with Plugins -->
    <script src="https://cdn.tailwindcss.com?plugins=forms,container-queries"></script>
    <!-- Tailwind Configuration verbatim as instructed -->
    <script id="tailwind-config">
      tailwind.config = {
        darkMode: "class",
        theme: {
          extend: {
            colors: {
              surface: "#f6faf8",
              "surface-container-highest": "#dfe3e1",
              "on-surface-variant": "#3d4a42",
              "inverse-surface": "#2d3130",
              "surface-dim": "#d7dbd9",
              "outline-variant": "#bccac0",
              "surface-container-lowest": "#ffffff",
              tertiary: "#006947",
              background: "#f6faf8",
              "on-error-container": "#93000a",
              "on-tertiary": "#ffffff",
              "tertiary-container": "#00855b",
              "primary-fixed": "#86f8c2",
              "on-secondary-fixed": "#00201c",
              "on-primary-fixed": "#002113",
              "tertiary-fixed-dim": "#4edea3",
              "on-background": "#181d1c",
              "surface-container-low": "#f0f4f2",
              "on-secondary": "#ffffff",
              "on-tertiary-fixed-variant": "#005236",
              "on-secondary-container": "#346e65",
              "on-primary-fixed-variant": "#005236",
              "tertiary-fixed": "#6ffbbe",
              "surface-bright": "#f6faf8",
              "on-tertiary-fixed": "#002113",
              "secondary-container": "#b2eee3",
              "inverse-primary": "#69dba8",
              "surface-container": "#ebefed",
              "on-secondary-fixed-variant": "#0f5048",
              outline: "#6d7a72",
              secondary: "#2d685f",
              "on-surface": "#181d1c",
              "on-error": "#ffffff",
              "on-primary": "#ffffff",
              error: "#ba1a1a",
              "error-container": "#ffdad6",
              "on-primary-container": "#f5fff6",
              "surface-container-high": "#e5e9e7",
              "on-tertiary-container": "#f5fff6",
              "surface-tint": "#006c49",
              "primary-fixed-dim": "#69dba8",
              primary: "#006947",
              "secondary-fixed-dim": "#97d2c7",
              "surface-variant": "#dfe3e1",
              "secondary-fixed": "#b2eee3",
              "primary-container": "#00855b",
              "inverse-on-surface": "#eef2f0",
            },
            borderRadius: {
              DEFAULT: "0.25rem",
              lg: "0.5rem",
              xl: "0.75rem",
              full: "9999px",
            },
            spacing: {
              "space-xs": "0.25rem",
              "space-md": "1rem",
              "space-xl": "2rem",
              "space-sm": "0.5rem",
              margin: "1rem",
              gutter: "1rem",
              "space-lg": "1.5rem",
            },
            fontFamily: {
              "headline-lg-mobile": ["Plus Jakarta Sans"],
              "headline-sm": ["Plus Jakarta Sans"],
              "label-lg": ["Plus Jakarta Sans"],
              "body-md": ["Plus Jakarta Sans"],
              "body-lg": ["Plus Jakarta Sans"],
              "body-sm": ["Plus Jakarta Sans"],
              "headline-md": ["Plus Jakarta Sans"],
              "headline-lg": ["Plus Jakarta Sans"],
              "label-md": ["Plus Jakarta Sans"],
              "label-sm": ["Plus Jakarta Sans"],
            },
            fontSize: {
              "headline-lg-mobile": [
                "24px",
                { lineHeight: "32px", fontWeight: "700" },
              ],
              "headline-sm": [
                "18px",
                { lineHeight: "24px", fontWeight: "600" },
              ],
              "label-lg": ["14px", { lineHeight: "20px", fontWeight: "600" }],
              "body-md": ["14px", { lineHeight: "20px", fontWeight: "400" }],
              "body-lg": ["16px", { lineHeight: "24px", fontWeight: "400" }],
              "body-sm": ["12px", { lineHeight: "16px", fontWeight: "400" }],
              "headline-md": [
                "20px",
                { lineHeight: "28px", fontWeight: "600" },
              ],
              "headline-lg": [
                "30px",
                { lineHeight: "38px", fontWeight: "700" },
              ],
              "label-md": ["12px", { lineHeight: "16px", fontWeight: "600" }],
              "label-sm": ["10px", { lineHeight: "14px", fontWeight: "700" }],
            },
          },
        },
      };
    </script>
    <style>
      .material-symbols-outlined {
        font-variation-settings:
          "FILL" 0,
          "wght" 400,
          "GRAD" 0,
          "opsz" 24;
        display: inline-block;
        vertical-align: middle;
        line-height: 1;
      }

      /* Subtle organic pulsing for the healthcare ambient glow */
      @keyframes pulse-subtle {
        0%,
        100% {
          opacity: 0.35;
          transform: scale(1);
        }
        50% {
          opacity: 0.55;
          transform: scale(1.05);
        }
      }

      .pulse-glow {
        animation: pulse-subtle 4s ease-in-out infinite;
      }

      /* Elegant progress bar loader */
      @keyframes progress-glide {
        0% {
          transform: translateX(-100%);
        }
        50% {
          transform: translateX(25%);
        }
        100% {
          transform: translateX(100%);
        }
      }

      .animate-progress-glide {
        animation: progress-glide 2.2s cubic-bezier(0.65, 0, 0.35, 1) infinite;
      }
    </style>
    <style>
      body {
        min-height: max(884px, 100dvh);
      }
    </style>
  </head>
  <body
    class="bg-background text-on-background font-body-md antialiased min-h-screen flex items-center justify-center p-0 selection:bg-secondary-container selection:text-on-secondary-container"
  >
    <!-- Mobile Viewport Container (Hospital Mobile Terminal Form Factor) -->
    <main
      class="relative w-full max-w-md h-screen max-h-[920px] bg-surface flex flex-col justify-between overflow-hidden shadow-2xl"
    >
      <!-- Top Fluid Curve Header Accent (Clinical Wave Motif) -->
      <div
        class="absolute top-0 left-0 right-0 w-full pointer-events-none select-none z-0"
      >
        <svg
          class="w-full h-44 sm:h-52 text-primary"
          fill="none"
          preserveaspectratio="none"
          viewbox="0 0 390 190"
          xmlns="http://www.w3.org/2000/svg"
        >
          <!-- Background light sage secondary swell -->
          <path
            d="M0 0H390V135C335.5 168 268.5 142 195 106C121.5 70 54 88 0 115V0Z"
            fill="currentColor"
            fill-opacity="0.12"
          ></path>
          <!-- Mid tone mint ripple -->
          <path
            d="M0 0H390V92C324.5 138 238.5 148 165 110C91.5 72 38 78 0 85V0Z"
            fill="currentColor"
            fill-opacity="0.28"
          ></path>
          <!-- Foreground primary surgical emerald wave -->
          <path
            d="M0 0H390V65C305 118 220 126 142 82C64 38 28 50 0 54V0Z"
            fill="currentColor"
            fill-opacity="0.9"
          ></path>
        </svg>
      </div>
      <!-- Status Bar Mockup (Android Healthcare Terminal) -->
      <div
        class="relative z-10 w-full flex justify-between items-center px-6 pt-3 text-on-primary"
      >
        <span class="font-label-md text-label-md tracking-tight font-semibold"
          >15:00</span
        >
        <div class="flex items-center gap-1.5 opacity-90">
          <span
            class="material-symbols-outlined text-[16px]"
            data-icon="signal_cellular_alt"
            >signal_cellular_alt</span
          >
          <span class="material-symbols-outlined text-[16px]" data-icon="wifi"
            >wifi</span
          >
          <span
            class="material-symbols-outlined text-[16px]"
            data-icon="battery_full"
            >battery_full</span
          >
        </div>
      </div>
      <!-- Ambient Subtle Geometric Aura Background (Glassmorphism backdrop) -->
      <div
        class="absolute inset-0 flex items-center justify-center pointer-events-none z-0"
      >
        <div
          class="w-72 h-72 rounded-full bg-primary-fixed/20 blur-3xl pulse-glow"
        ></div>
        <div
          class="absolute w-56 h-56 rounded-full bg-secondary-fixed/30 blur-2xl -translate-y-12"
        ></div>
      </div>
      <!-- Center Content: Brand Logo, Geometric Emblem & Identity -->
      <div
        class="relative z-10 flex-1 flex flex-col items-center justify-center px-margin text-center"
      >
        <!-- Modern Geometric Healthcare Shield Logo -->
        <div class="relative mb-6 group cursor-default">
          <!-- Outer Glass Ring Frame -->
          <div
            class="w-28 h-28 rounded-2xl bg-surface-container-lowest/80 backdrop-blur-md border border-white/80 shadow-[0_16px_36px_-6px_rgba(0,105,71,0.18)] flex items-center justify-center p-3 relative overflow-hidden"
          >
            <!-- Inner Faceted Emerald Accent Gradients -->
            <div
              class="absolute inset-0 bg-gradient-to-tr from-primary/10 via-transparent to-primary-fixed/30"
            ></div>
            <!-- Central Multi-layered Hexagon Health & Staff Emblem -->
            <div
              class="relative w-full h-full flex flex-col items-center justify-center"
            >
              <!-- Geometric Medical Cross & People Motif (Representing RSD dr. Soebandi Presensi) -->
              <div
                class="w-16 h-16 rounded-xl bg-gradient-to-br from-primary to-tertiary-container flex items-center justify-center shadow-md relative"
              >
                <!-- Subtle inner white outline ring -->
                <div
                  class="absolute inset-0.5 rounded-[10px] border border-white/30"
                ></div>
                <!-- Intertwined Personnel & Hospital Symbols -->
                <div
                  class="flex flex-col items-center justify-center text-on-primary"
                >
                  <span
                    class="material-symbols-outlined text-3xl font-light"
                    data-icon="badge"
                    >badge</span
                  >
                </div>
                <!-- Miniature floating verification satellite badge -->
                <div
                  class="absolute -top-1 -right-1 w-6 h-6 rounded-full bg-surface-container-lowest shadow-sm flex items-center justify-center border border-primary/20"
                >
                  <span
                    class="material-symbols-outlined text-primary text-[14px]"
                    data-icon="verified"
                    style="font-variation-settings: &quot;FILL&quot; 1"
                    >verified</span
                  >
                </div>
              </div>
            </div>
          </div>
          <!-- Pulse Ring Behind Logo -->
          <div
            class="absolute -inset-2 rounded-3xl border border-primary/15 scale-95 pointer-events-none"
          ></div>
        </div>
        <!-- Typography Brand Cluster -->
        <div class="space-y-1 max-w-xs">
          <!-- Main Brand Acronym -->
          <h1
            class="font-headline-lg-mobile text-headline-lg-mobile font-bold tracking-tight text-primary"
          >
            SOESIE
          </h1>
          <!-- Primary Subtitle (Functionality) -->
          <p
            class="font-label-lg text-label-lg text-on-surface font-semibold tracking-normal"
          >
            Presensi Elektronik Pegawai
          </p>
          <!-- Institutional Affiliation Badge / Tagline -->
          <div
            class="pt-2 flex items-center justify-center gap-1.5 text-on-surface-variant"
          >
            <span
              class="material-symbols-outlined text-tertiary text-base"
              data-icon="local_hospital"
              >local_hospital</span
            >
            <span class="font-body-md text-body-md font-medium tracking-tight">
              RSD dr. Soebandi Jember
            </span>
          </div>
        </div>
        <!-- Trust Indicator Micro-Badge -->
        <div
          class="mt-6 inline-flex items-center gap-2 px-3 py-1 rounded-full bg-surface-container-lowest/90 border border-outline-variant/30 shadow-sm backdrop-blur-sm"
        >
          <span
            class="w-2 h-2 rounded-full bg-tertiary-container animate-pulse"
          ></span>
          <span class="font-label-sm text-label-sm text-on-surface-variant"
            >Sistem Terenkripsi &amp; Presisi GPS</span
          >
        </div>
      </div>
      <!-- Bottom Section: Loading Indicator, Metadata & Official Copyright -->
      <div
        class="relative z-10 w-full flex flex-col items-center pb-8 px-6 text-center"
      >
        <!-- Minimalist Loading Progress Track -->
        <div
          class="w-36 h-1 bg-surface-container-highest/60 rounded-full overflow-hidden mb-6 relative"
        >
          <div
            class="h-full bg-gradient-to-r from-primary via-primary-container to-tertiary-fixed-dim rounded-full w-full animate-progress-glide"
          ></div>
        </div>
        <!-- Version & Hospital Information System Tag -->
        <p
          class="font-body-sm text-body-sm text-on-surface-variant font-medium mb-1"
        >
          Versi 2.4.0 • Sistem Informasi Rumah Sakit Terintegrasi
        </p>
        <!-- Municipal & Hospital Government Accreditation -->
        <div class="flex items-center justify-center gap-1.5 text-outline">
          <span
            class="material-symbols-outlined text-xs"
            data-icon="account_balance"
            >account_balance</span
          >
          <span class="font-label-sm text-label-sm tracking-wide">
            PEMERINTAH KABUPATEN JEMBER
          </span>
        </div>
        <!-- Safe Area Inset Indicator for Mobile Hardware -->
        <div class="w-28 h-1 bg-on-surface/20 rounded-full mt-4"></div>
      </div>
      <!-- Bottom Fluid Curve Anchor Accent -->
      <div
        class="absolute bottom-0 left-0 right-0 w-full pointer-events-none select-none z-0 rotate-180"
      >
        <svg
          class="w-full h-24 sm:h-28 text-primary"
          fill="none"
          preserveaspectratio="none"
          viewbox="0 0 390 120"
          xmlns="http://www.w3.org/2000/svg"
        >
          <path
            d="M0 0H390V60C310 110 215 118 135 75C60 35 25 45 0 50V0Z"
            fill="currentColor"
            fill-opacity="0.10"
          ></path>
          <path
            d="M0 0H390V40C295 95 210 98 120 50C50 18 20 28 0 32V0Z"
            fill="currentColor"
            fill-opacity="0.75"
          ></path>
        </svg>
      </div>
    </main>
    <!-- Interactive Mock Touch Ripple & Smooth Screen Transit Trigger (Micro-interaction) -->
    <script>
      document.addEventListener("DOMContentLoaded", () => {
        // Optional interactive feedback: tapping anywhere gently pulses the logo
        const appContainer = document.querySelector("main");
        const logoShield = document.querySelector(".group");

        if (appContainer && logoShield) {
          appContainer.addEventListener("click", () => {
            logoShield.classList.add("scale-105");
            setTimeout(() => {
              logoShield.classList.remove("scale-105");
            }, 200);
          });
        }
      });
    </script>
  </body>
</html>
